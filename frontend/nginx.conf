# Serves the Vite build output as a single-page app -- react-router-dom (BrowserRouter) needs
# every path to fall back to index.html rather than a 404 from nginx.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
